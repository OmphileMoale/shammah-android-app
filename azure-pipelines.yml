trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: JavaToolInstaller@0
  displayName: 'Use Java 21'
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: chmod +x gradlew
  displayName: 'Make Gradle wrapper executable'

- script: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
  displayName: 'Accept Android SDK licenses'

- script: ./gradlew testDebugUnitTest --stacktrace
  displayName: 'Run automated unit tests'

- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/TEST-*.xml'

- script: ./gradlew assembleDebug --stacktrace
  displayName: 'Build debug APK'

- task: PublishBuildArtifacts@1
  displayName: 'Publish APK'
  inputs:
    pathToPublish: 'app/build/outputs/apk/debug'
    artifactName: 'shammah-debug-apk'